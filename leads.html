<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads | Precision Electronics Repair</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="stylesheet" href="crm.css">
<style>
  .lead { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
  .lead .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .lead .co { font-weight: 700; color: var(--navy); font-size: 15px; }
  .lead select { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .due { color: var(--red); font-weight: 600; }

  /* colour down the left edge, by where the lead has got to */
  .lead { border-left-width: 5px; }
  .lead.s-to_contact { border-left-color: #c4ccd8; }
  .lead.s-contacted  { border-left-color: #d9a441; background: #fffdf8; }
  .lead.s-interested { border-left-color: #2f7bd1; background: #f7fbff; }
  .lead.s-quoted     { border-left-color: #7a4fd1; background: #fbf9ff; }
  .lead.s-won        { border-left-color: #1c6b3c; background: #f6fbf8; }
  .lead.s-lost       { border-left-color: #b3261e; background: #fdf7f6; }
  .lead.s-lost .co   { color: var(--muted); text-decoration: line-through; }
  .lead.overdue      { box-shadow: inset 0 0 0 1px #f3c2bd; }

  .key { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px; color: var(--muted); }
  .key span { display: flex; align-items: center; gap: 6px; }
  .key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .log { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .log .row { gap: 10px; }
  .log select, .log textarea { margin-bottom: 8px; }
  .log textarea { min-height: 56px; }
  .entries { list-style: none; margin: 10px 0 0; padding: 0; }
  .entries li { border-left: 3px solid var(--line); padding: 2px 0 10px 12px; margin-bottom: 8px; }
  .entries .when { color: var(--muted); font-size: 12px; }
  .entries .what { font-size: 14px; white-space: pre-wrap; }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2>Add a prospect</h2>
      <div class="row">
        <div><label for="nCompany">Company *</label><input type="text" id="nCompany" placeholder="Watford Phone Repairs"></div>
        <div><label for="nName">Contact name</label><input type="text" id="nName"></div>
        <div><label for="nTown">Town</label><input type="text" id="nTown" placeholder="Watford"></div>
      </div>
      <div class="row">
        <div><label for="nEmail">Email</label><input type="email" id="nEmail"></div>
        <div><label for="nPhone">Phone</label><input type="text" id="nPhone"></div>
        <div style="flex:0 0 200px"><label for="nType">Type</label>
          <select id="nType">
            <option>phone/laptop shop</option>
            <option>console repair</option>
            <option>computer repair</option>
            <option>audio / hi-fi</option>
            <option>TV repair</option>
            <option>other</option>
          </select>
        </div>
      </div>
      <label for="nNotes">Notes</label>
      <textarea id="nNotes" placeholder="Where you found them, who to ask for, what they said."></textarea>
      <button class="primary" id="addBtn">Add prospect</button>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div style="flex:2 1 240px"><input type="search" id="search" placeholder="Search company, town or contact" style="margin-bottom:0"></div>
        <div style="flex:0 0 190px">
          <select id="filter" style="margin-bottom:0">
            <option value="open">Open leads</option>
            <option value="">All</option>
            <option value="to_contact">To contact</option>
            <option value="contacted">Contacted</option>
            <option value="interested">Interested</option>
            <option value="quoted">Quoted</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
          </select>
        </div>
      </div>
      <div class="stats" id="counts" style="margin-bottom:12px"></div>
      <div class="key">
        <span><i style="background:#c4ccd8"></i>To contact</span>
        <span><i style="background:#d9a441"></i>Contacted</span>
        <span><i style="background:#2f7bd1"></i>Interested</span>
        <span><i style="background:#7a4fd1"></i>Quoted</span>
        <span><i style="background:#1c6b3c"></i>Won</span>
        <span><i style="background:#b3261e"></i>Lost</span>
      </div>
      <div id="listArea"><p class="empty">Loading…</p></div>
    </div>

  </div>
</main>

<script type="module">
import { sb, $, show, hide, esc, when, waLink, waTarget, chrome, requireSession } from './crm.js';

chrome('leads.html');

const STATUSES = [
  ['to_contact', 'To contact'], ['contacted', 'Contacted'], ['interested', 'Interested'],
  ['quoted', 'Quoted'], ['won', 'Won'], ['lost', 'Lost']
];

const PITCH = "Hi, I'm Mitchell from Precision Electronics Repair in Watford. We do board-level repair — microsoldering, BGA rework, charging ICs, no-power faults — for repair shops that don't do it in-house. You keep the customer, we do the bench work and send it back tested with photos. Happy to take a first board whenever you've got one that's stuck.";

const EMAIL_SUBJECT = "Board-level repair for the jobs you turn away";

const EMAIL_BODY = `Hello,

I'm Mitchell, and I run Precision Electronics Repair in Watford. I do board-level work — microsoldering, BGA rework, charging ICs, no-power and no-boot faults — for repair shops that don't do it in-house.

The idea is simple. When a board beats you, send it to me instead of turning the customer away. You keep the customer and add your own markup, I do the bench work and send it back tested with photographs of what was done.

How it works:

· Trade price is 25% off my published prices — they're all on precisionelectronicsrepair.co.uk
· Diagnosis is free. If I haven't found the fault within two hours it comes back with a written account of everything I tested, and there's nothing to pay.
· You'll have a diagnosis or a no-fix within three working days of it reaching my bench.
· Royal Mail both ways. Return postage goes on the invoice at cost.

No account to set up and no minimum. If there's a board sitting in a drawer you've given up on, send that one and see what you make of the work.

Mitchell Morris
Precision Electronics Repair
07522 124273
info@precisionelectronicsrepair.co.uk
262D Boundary Way, Watford, WD25 7SX

If you'd rather I didn't contact you again, just reply saying so and I won't.`;

// What the follow-up should remind you to do, per stage
const CHASE = {
  to_contact: r => 'Send the pitch to ' + r.company,
  contacted:  r => 'Chase ' + r.company + ' — pitch sent, no reply yet',
  interested: r => 'Follow up ' + r.company + ' — they were interested, ask for a first board',
  quoted:     r => 'Chase ' + r.company + ' for a decision on the quote'
};

let ROWS = [];

async function start() {
  const sess = await requireSession();
  if (!sess) return;
  load();
}

async function load() {
  const { data, error } = await sb.from('leads').select('*').order('updated_at', { ascending: false });
  if (error) return show($('msg'), error.message, 'err');
  ROWS = data || [];
  render();
}

function counts() {
  const c = {};
  STATUSES.forEach(([k]) => c[k] = ROWS.filter(r => r.status === k).length);
  $('counts').innerHTML = STATUSES.map(([k, label]) =>
    `<div class="stat"><div class="n">${c[k]}</div><div class="l">${label}</div></div>`).join('');
}

function render() {
  counts();
  const q = $('search').value.trim().toLowerCase();
  const f = $('filter').value;
  let rows = ROWS;
  if (f === 'open') rows = rows.filter(r => !['won', 'lost'].includes(r.status));
  else if (f) rows = rows.filter(r => r.status === f);
  if (q) rows = rows.filter(r => [r.company, r.town, r.contact_name, r.email, r.phone].join(' ').toLowerCase().includes(q));

  if (!rows.length) { $('listArea').innerHTML = '<p class="empty">Nothing here.</p>'; return; }

  const today = new Date().toISOString().slice(0, 10);

  $('listArea').innerHTML = rows.map(r => `
    <div class="lead s-${esc(r.status)}${r.next_action && r.next_action <= today && !['won','lost'].includes(r.status) ? ' overdue' : ''}">
      <div class="top">
        <div>
          <div class="co">${esc(r.company)}</div>
          <div class="muted">${[r.contact_name, r.town, r.type].filter(Boolean).map(esc).join(' · ')}</div>
          <div class="muted">${[r.email, r.phone].filter(Boolean).map(esc).join(' · ')}</div>
        </div>
        <select data-status="${r.id}">
          ${STATUSES.map(([k, l]) => `<option value="${k}"${r.status === k ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      ${r.notes ? `<div style="font-size:14px;margin-top:8px;white-space:pre-wrap">${esc(r.notes)}</div>` : ''}
      <div class="muted" style="margin-top:8px">
        ${r.next_action && !['won','lost'].includes(r.status)
            ? `${r.next_action <= today ? '<span class="due">Due now: ' + esc(CHASE[r.status] ? CHASE[r.status](r) : 'Follow up') + '</span>' : 'Next action ' + when(r.next_action) + ' — ' + esc(CHASE[r.status] ? CHASE[r.status](r) : 'Follow up')} · `
            : ''}
        Added ${when(r.created_at)}
      </div>
      <div class="acts">
        ${r.email ? `<a class="btn-sm" data-pitch="${r.id}" data-chan="email" href="mailto:${esc(r.email)}?subject=${encodeURIComponent(EMAIL_SUBJECT)}&body=${encodeURIComponent(EMAIL_BODY)}">Email pitch</a>` : ''}
        ${r.phone ? `<a class="btn-sm wa" data-pitch="${r.id}" data-chan="whatsapp" target="${waTarget}" rel="noopener" href="${waLink(r.phone, PITCH)}">WhatsApp pitch</a>` : ''}
        ${r.phone ? `<a class="btn-sm" href="tel:${esc(r.phone)}">Call</a>` : ''}
        <button class="btn-sm" data-log="${r.id}">Conversation log</button>
        <button class="btn-sm" data-note="${r.id}">Add note</button>
        <button class="btn-sm" data-next="${r.id}">Set next action</button>
        ${r.status === 'won' ? '' : `<button class="btn-sm" data-convert="${r.id}">Convert to job</button>`}
      </div>
      <div class="log" id="log-${r.id}" style="display:none">
        <div class="row">
          <div style="flex:0 0 140px">
            <select data-chan="${r.id}">
              <option value="call">Phone call</option>
              <option value="email">Email</option>
              <option value="whatsapp">WhatsApp</option>
              <option value="sms">Text</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div style="flex:0 0 160px">
            <select data-dir="${r.id}">
              <option value="out">I contacted them</option>
              <option value="in">They contacted me</option>
            </select>
          </div>
        </div>
        <textarea data-text="${r.id}" placeholder="Spoke to Dave. Said they send board jobs to London, takes 2 weeks. Will try me next time."></textarea>
        <button class="btn-sm" data-save="${r.id}">Save to log</button>
        <ul class="entries" id="entries-${r.id}"></ul>
      </div>
    </div>`).join('');

  wire();
}

const CHAN = { call: 'Call', email: 'Email', whatsapp: 'WhatsApp', sms: 'Text', system: 'System', other: 'Note' };
const stamp = ts => new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

async function logEntry(leadId, channel, direction, summary, body) {
  const { data: sess } = await sb.auth.getSession();
  const { error } = await sb.from('comms').insert({
    lead_id: leadId, direction, channel, summary, body: body || null,
    logged_by: sess?.session?.user?.email, auto: false
  });
  if (error) show($('msg'), error.message, 'err');
  return !error;
}

async function loadEntries(leadId) {
  const el = $('entries-' + leadId);
  if (!el) return;
  const { data, error } = await sb.from('comms').select('*').eq('lead_id', leadId).order('occurred_at', { ascending: false });
  if (error) return show($('msg'), error.message, 'err');
  el.innerHTML = (data || []).map(c => `
    <li>
      <div class="when">${stamp(c.occurred_at)} · ${c.direction === 'in' ? '&larr; from them' : '&rarr; to them'} · ${esc(CHAN[c.channel] || c.channel)}</div>
      <div class="what" style="font-weight:600">${esc(c.summary)}</div>
      ${c.body ? `<div class="what" style="color:var(--muted)">${esc(c.body)}</div>` : ''}
    </li>`).join('') || '<li class="when">Nothing logged with this shop yet.</li>';
}

function wire() {
  $('listArea').querySelectorAll('[data-log]').forEach(b => b.addEventListener('click', () => {
    const panel = $('log-' + b.dataset.log);
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    if (!open) loadEntries(b.dataset.log);
  }));

  $('listArea').querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.save;
    const text = $('listArea').querySelector(`[data-text="${id}"]`).value.trim();
    if (!text) return show($('msg'), 'Write what was said first.', 'err');
    const chan = $('listArea').querySelector(`[data-chan="${id}"]`).value;
    const dir = $('listArea').querySelector(`[data-dir="${id}"]`).value;
    const row = ROWS.find(r => r.id === id);
    const head = (dir === 'in' ? 'From ' : 'To ') + row.company + ' on ' + (CHAN[chan] || chan);
    if (await logEntry(id, chan, dir, head, text)) {
      $('listArea').querySelector(`[data-text="${id}"]`).value = '';
      loadEntries(id);
    }
  }));

  // clicking a pitch button records itself
  $('listArea').querySelectorAll('[data-pitch]').forEach(a => a.addEventListener('click', async () => {
    const row = ROWS.find(r => r.id === a.dataset.pitch);
    const chan = a.dataset.chan;
    await logEntry(row.id, chan, 'out', 'Pitch sent to ' + row.company + ' by ' + (CHAN[chan] || chan));
    loadEntries(row.id);
  }));

  $('listArea').querySelectorAll('[data-status]').forEach(sel => sel.addEventListener('change', async () => {
    hide($('msg'));
    const row = ROWS.find(r => r.id === sel.dataset.status);
    const status = sel.value;
    const closed = status === 'won' || status === 'lost';
    const due = closed ? null : new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);

    const { error } = await sb.from('leads')
      .update({ status, next_action: due, updated_at: new Date().toISOString() })
      .eq('id', row.id);
    if (error) return show($('msg'), error.message, 'err');

    // one open follow-up per lead — clear any earlier one first
    await sb.from('follow_ups').delete().eq('lead_id', row.id).eq('done', false);

    if (!closed) {
      const title = (CHASE[status] || (r => 'Follow up ' + r.company))(row);
      const { error: fe } = await sb.from('follow_ups').insert({ title, due_date: due, lead_id: row.id });
      if (fe) return show($('msg'), fe.message, 'err');
      show($('msg'), 'Follow-up set for ' + when(due) + ': ' + title, 'ok');
    } else {
      show($('msg'), row.company + ' marked ' + status + '. Follow-up cleared.', 'ok');
    }
    load();
  }));

  $('listArea').querySelectorAll('[data-note]').forEach(b => b.addEventListener('click', async () => {
    const row = ROWS.find(r => r.id === b.dataset.note);
    const add = prompt('Add a note for ' + row.company);
    if (!add) return;
    const stamp = new Date().toLocaleDateString('en-GB');
    const notes = (row.notes ? row.notes + '\n' : '') + stamp + ': ' + add;
    await sb.from('leads').update({ notes, updated_at: new Date().toISOString() }).eq('id', row.id);
    load();
  }));

  $('listArea').querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', async () => {
    const days = prompt('Chase in how many days?', '7');
    if (days === null) return;
    const d = new Date(Date.now() + (parseInt(days, 10) || 7) * 864e5).toISOString().slice(0, 10);
    const row = ROWS.find(r => r.id === b.dataset.next);
    await sb.from('leads').update({ next_action: d, updated_at: new Date().toISOString() }).eq('id', row.id);
    await sb.from('follow_ups').delete().eq('lead_id', row.id).eq('done', false);
    const title = (CHASE[row.status] || (x => 'Chase ' + x.company))(row);
    await sb.from('follow_ups').insert({ title, due_date: d, lead_id: row.id });
    show($('msg'), 'Follow-up set for ' + when(d) + '.', 'ok');
    load();
  }));

  $('listArea').querySelectorAll('[data-convert]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Create a job and send them a booking link?')) return;
    const { data, error } = await sb.rpc('convert_lead', { p_lead_id: b.dataset.convert });
    if (error) return show($('msg'), error.message, 'err');
    const job = Array.isArray(data) ? data[0] : data;
    show($('msg'), job.job_number + ' created. Open Jobs to send the booking link.', 'ok');
    load();
  }));
}

$('search').addEventListener('input', render);
$('filter').addEventListener('change', render);

$('addBtn').addEventListener('click', async () => {
  hide($('msg'));
  const company = $('nCompany').value.trim();
  if (!company) return show($('msg'), 'Enter the company name.', 'err');
  const { error } = await sb.from('leads').insert({
    company,
    contact_name: $('nName').value.trim() || null,
    town: $('nTown').value.trim() || null,
    email: $('nEmail').value.trim() || null,
    phone: $('nPhone').value.trim() || null,
    type: $('nType').value,
    notes: $('nNotes').value.trim() || null
  });
  if (error) return show($('msg'), error.message, 'err');
  ['nCompany','nName','nTown','nEmail','nPhone','nNotes'].forEach(i => $(i).value = '');
  show($('msg'), 'Prospect added.', 'ok');
  load();
});

start();
</script>

</body>
</html>
