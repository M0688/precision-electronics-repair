<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts | Precision Electronics Repair</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="stylesheet" href="crm.css">
</head>
<body>

<main>
  <div class="wrap">
    <div id="msg" class="msg"></div>

    <!-- LIST -->
    <div id="listView" style="display:none">
      <div class="card">
        <h2>Add a contact</h2>
        <div class="row">
          <div><label for="nName">Name</label><input type="text" id="nName" placeholder="Jane Smith"></div>
          <div><label for="nCompany">Company <span class="muted">— trade only</span></label><input type="text" id="nCompany" placeholder="Watford Phone Repairs"></div>
          <div><label for="nEmail">Email</label><input type="email" id="nEmail"></div>
          <div><label for="nPhone">Phone</label><input type="text" id="nPhone"></div>
        </div>
        <button class="primary" id="addBtn">Add contact</button>
      </div>

      <div class="card">
        <h2>Contacts</h2>
        <div class="row" style="margin-bottom:6px">
          <div style="flex:2 1 260px"><input type="search" id="search" placeholder="Search name, company, email or phone" style="margin-bottom:0"></div>
          <div style="flex:0 0 170px">
            <select id="filter" style="margin-bottom:0">
              <option value="">Everyone</option>
              <option value="trade">Trade accounts</option>
              <option value="customer">Customers</option>
              <option value="repeat">Repeat customers</option>
            </select>
          </div>
        </div>
        <div id="listArea"><p class="empty">Loading…</p></div>
      </div>
    </div>

    <!-- DETAIL -->
    <div id="detailView" style="display:none">
      <p style="margin:0 0 14px"><a href="contacts.html">&larr; All contacts</a></p>

      <div class="card">
        <h1 id="cName"></h1>
        <p class="sub" id="cSub"></p>
        <div class="row">
          <div><label for="eName">Name</label><input type="text" id="eName"></div>
          <div><label for="eCompany">Company</label><input type="text" id="eCompany"></div>
        </div>
        <div class="row">
          <div><label for="eEmail">Email</label><input type="email" id="eEmail"></div>
          <div><label for="ePhone">Phone</label><input type="text" id="ePhone"></div>
          <div style="flex:0 0 160px"><label for="eKind">Type</label>
            <select id="eKind"><option value="customer">Customer</option><option value="trade">Trade account</option></select>
          </div>
        </div>
        <label for="eAddress">Address</label>
        <textarea id="eAddress" style="min-height:70px"></textarea>
        <label for="eNotes">Notes</label>
        <textarea id="eNotes" placeholder="What they send you, who to ask for, payment terms, anything useful."></textarea>
        <div class="row" style="align-items:center">
          <div style="flex:0 0 auto"><button class="primary" id="saveBtn">Save</button></div>
          <div style="flex:0 0 auto"><a class="btn-sm" id="cEmailBtn">Email</a></div>
          <div style="flex:0 0 auto"><a class="btn-sm wa" id="cWaBtn" target="_blank" rel="noopener">WhatsApp</a></div>
          <div style="flex:0 0 auto"><a class="btn-sm" id="cCallBtn">Call</a></div>
        </div>
      </div>

      <div class="card">
        <h2>Jobs</h2>
        <div id="cJobs"><p class="empty">Loading…</p></div>
      </div>

      <div class="card">
        <h2>Communication</h2>
        <p class="sub" style="margin-bottom:12px">Everything across all their jobs. Log new entries on the job itself.</p>
        <ul class="notes" id="cComms"><li class="when">Loading…</li></ul>
      </div>

      <div class="card">
        <h2>Follow-ups</h2>
        <div id="fuMsg" class="msg"></div>
        <div class="row">
          <div><label for="fuTitle">What needs doing</label><input type="text" id="fuTitle" placeholder="Call about the PS5 board"></div>
          <div style="flex:0 0 180px"><label for="fuDate">When</label><input type="date" id="fuDate"></div>
          <div style="flex:0 0 auto"><button class="primary" id="fuBtn" style="margin-bottom:14px">Add</button></div>
        </div>
        <div id="fuList"></div>
      </div>
    </div>

  </div>
</main>

<script type="module">
import { sb, $, show, hide, esc, when, money, waLink, chrome, requireSession } from './crm.js';

chrome('contacts.html');
const ID = new URLSearchParams(location.search).get('id');

async function start() {
  const sess = await requireSession();
  if (!sess) return;
  if (ID) { $('detailView').style.display = 'block'; loadContact(); }
  else { $('listView').style.display = 'block'; loadList(); }
}

/* ---------- list ---------- */
let ROWS = [];

async function loadList() {
  const { data, error } = await sb.from('contact_list').select('*').order('created_at', { ascending: false });
  if (error) return show($('msg'), error.message, 'err');
  ROWS = data || [];
  render();
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const f = $('filter').value;
  let rows = ROWS;
  if (f === 'trade' || f === 'customer') rows = rows.filter(r => r.kind === f);
  if (f === 'repeat') rows = rows.filter(r => r.job_count > 1);
  if (q) rows = rows.filter(r => [r.name, r.company, r.email, r.phone].join(' ').toLowerCase().includes(q));

  if (!rows.length) { $('listArea').innerHTML = '<p class="empty">Nothing matches.</p>'; return; }

  $('listArea').innerHTML = `<table>
    <thead><tr><th>Name</th><th class="hide">Contact</th><th>Jobs</th><th class="hide">Paid</th><th class="hide">Last job</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td><a href="contacts.html?id=${r.id}" style="font-weight:600;text-decoration:none">${esc(r.company || r.name || 'Unnamed')}</a>
          ${r.company && r.name ? `<div class="muted">${esc(r.name)}</div>` : ''}
          ${r.kind === 'trade' ? '<span class="tag in" style="margin-top:4px">Trade</span>' : ''}</td>
        <td class="hide">${esc(r.email || '')}${r.phone ? `<div class="muted">${esc(r.phone)}</div>` : ''}</td>
        <td>${r.job_count}</td>
        <td class="hide">${money(r.total_paid)}</td>
        <td class="hide">${when(r.last_job_at)}</td>
      </tr>`).join('')}</tbody></table>`;
}

if ($('search')) {
  $('search').addEventListener('input', render);
  $('filter').addEventListener('change', render);
  $('addBtn').addEventListener('click', async () => {
    hide($('msg'));
    const name = $('nName').value.trim(), company = $('nCompany').value.trim();
    if (!name && !company) return show($('msg'), 'Enter a name or a company.', 'err');
    const { error } = await sb.from('contacts').insert({
      name: name || null, company: company || null,
      email: $('nEmail').value.trim() || null, phone: $('nPhone').value.trim() || null,
      kind: company ? 'trade' : 'customer'
    });
    if (error) return show($('msg'), error.message, 'err');
    ['nName','nCompany','nEmail','nPhone'].forEach(i => $(i).value = '');
    show($('msg'), 'Contact added.', 'ok');
    loadList();
  });
}

/* ---------- detail ---------- */
let C = null;

async function loadContact() {
  const { data, error } = await sb.from('contact_list').select('*').eq('id', ID).maybeSingle();
  if (error || !data) return show($('msg'), error ? error.message : 'Contact not found.', 'err');
  C = data;

  $('cName').textContent = data.company || data.name || 'Unnamed contact';
  $('cSub').textContent = [
    data.kind === 'trade' ? 'Trade account' : 'Customer',
    `${data.job_count} job${data.job_count === 1 ? '' : 's'}`,
    `${money(data.total_paid)} paid`
  ].join(' · ');

  $('eName').value = data.name || ''; $('eCompany').value = data.company || '';
  $('eEmail').value = data.email || ''; $('ePhone').value = data.phone || '';
  $('eAddress').value = data.address || ''; $('eNotes').value = data.notes || '';
  $('eKind').value = data.kind || 'customer';

  $('cEmailBtn').href = data.email ? 'mailto:' + data.email : '#';
  $('cCallBtn').href = data.phone ? 'tel:' + data.phone : '#';
  $('cWaBtn').href = waLink(data.phone, `Hi${data.name ? ' ' + data.name.split(' ')[0] : ''}, `);
  ['cEmailBtn','cCallBtn'].forEach(b => { if ($(b).getAttribute('href') === '#') $(b).style.display = 'none'; });
  if (!data.phone) $('cWaBtn').style.display = 'none';

  loadJobs(); loadComms(); loadFollowUps();
  $('fuDate').value = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
}

async function loadJobs() {
  const { data: jobs } = await sb.from('jobs').select('id,job_number,status,created_at').eq('contact_id', ID).order('created_at', { ascending: false });
  if (!jobs || !jobs.length) { $('cJobs').innerHTML = '<p class="empty">No jobs yet.</p>'; return; }
  $('cJobs').innerHTML = `<table><tbody>${jobs.map(j => `
    <tr><td><a href="job.html?job=${j.job_number}" style="font-weight:700;text-decoration:none">${j.job_number}</a></td>
        <td>${esc(String(j.status).replace(/_/g, ' '))}</td>
        <td class="hide">${when(j.created_at)}</td></tr>`).join('')}</tbody></table>`;
}

const CHANNEL_LABEL = { email: 'Email', whatsapp: 'WhatsApp', sms: 'Text', call: 'Call', system: 'System', other: 'Note' };
const stamp = ts => ts ? new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

async function loadComms() {
  const { data } = await sb.from('comm_feed').select('*').eq('contact_id', ID).order('occurred_at', { ascending: false }).limit(200);
  if (!data || !data.length) { $('cComms').innerHTML = '<li class="when">Nothing logged yet.</li>'; return; }
  $('cComms').innerHTML = data.map(c => {
    const arrow = c.direction === 'in' ? '&larr;' : c.direction === 'out' ? '&rarr;' : '·';
    const cls = c.direction === 'in' ? 'in' : c.direction === 'out' ? 'wait' : 'off';
    return `<li>
      <div class="when">${stamp(c.occurred_at)} · <span class="tag ${cls}" style="padding:2px 8px">${arrow} ${esc(CHANNEL_LABEL[c.channel] || c.channel)}</span>${c.job_number ? ` · <a href="job.html?job=${esc(c.job_number)}">${esc(c.job_number)}</a>` : ''}</div>
      <div class="what" style="font-weight:600">${esc(c.summary)}</div>
      ${c.body ? `<div class="what" style="color:var(--muted)">${esc(c.body)}</div>` : ''}
    </li>`;
  }).join('');
}

async function loadFollowUps() {
  const { data } = await sb.from('follow_ups').select('*').eq('contact_id', ID).order('due_date');
  if (!data || !data.length) { $('fuList').innerHTML = '<p class="empty">Nothing to chase.</p>'; return; }
  $('fuList').innerHTML = `<table><tbody>${data.map(f => `
    <tr>
      <td>${f.done ? '<span style="color:var(--muted);text-decoration:line-through">' + esc(f.title) + '</span>' : esc(f.title)}</td>
      <td class="muted">${when(f.due_date)}</td>
      <td style="text-align:right">${f.done ? '<span class="tag in">Done</span>' : `<button class="btn-sm" data-done="${f.id}">Mark done</button>`}</td>
    </tr>`).join('')}</tbody></table>`;
  $('fuList').querySelectorAll('[data-done]').forEach(b => b.addEventListener('click', async () => {
    await sb.from('follow_ups').update({ done: true, done_at: new Date().toISOString() }).eq('id', b.dataset.done);
    loadFollowUps();
  }));
}

if ($('saveBtn')) {
  $('saveBtn').addEventListener('click', async () => {
    hide($('msg'));
    const { error } = await sb.from('contacts').update({
      name: $('eName').value.trim() || null,
      company: $('eCompany').value.trim() || null,
      email: $('eEmail').value.trim() || null,
      phone: $('ePhone').value.trim() || null,
      address: $('eAddress').value.trim() || null,
      notes: $('eNotes').value.trim() || null,
      kind: $('eKind').value
    }).eq('id', ID);
    if (error) return show($('msg'), error.message, 'err');
    show($('msg'), 'Saved.', 'ok');
    loadContact();
  });

  $('fuBtn').addEventListener('click', async () => {
    hide($('fuMsg'));
    const title = $('fuTitle').value.trim();
    if (!title) return show($('fuMsg'), 'What needs doing?', 'err');
    const { error } = await sb.from('follow_ups').insert({ title, due_date: $('fuDate').value, contact_id: ID });
    if (error) return show($('fuMsg'), error.message, 'err');
    $('fuTitle').value = '';
    show($('fuMsg'), 'Follow-up added.', 'ok');
    loadFollowUps();
  });
}

start();
</script>

</body>
</html>
