<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop | Precision Electronics Repair</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PER Workshop">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --navy: #1B2A4A; --navy-dark: #121d34; --ink: #1f2733; --muted: #5a6474;
    --line: #d9dee6; --soft: #f4f6f9; --white: #fff; --red: #b3261e; --green: #1c6b3c; --amber: #8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--soft); line-height: 1.55; }
  a { color: var(--navy); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  header { background: var(--navy); color: #fff; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-weight: 700; letter-spacing: .5px; font-size: 15px; }
  .who { font-size: 14px; color: #cdd6e6; display: flex; align-items: center; gap: 14px; }
  .who button { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }

  main { padding: 28px 0 64px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  h1 { font-size: 22px; color: var(--navy); margin: 0 0 4px; }
  h2 { font-size: 17px; color: var(--navy); margin: 0 0 14px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 5px; }
  input[type=text], input[type=email] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; margin-bottom: 14px; }
  input:focus { outline: 2px solid var(--navy); outline-offset: 1px; }
  button.primary { background: var(--navy); color: #fff; border: 0; border-radius: 8px; font: inherit; font-weight: 700; padding: 12px 22px; cursor: pointer; }
  button.primary:hover { background: var(--navy-dark); }
  button.primary:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1 1 220px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  .jobno { font-weight: 700; color: var(--navy); white-space: nowrap; }

  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .tag.wait { background: #fff4e0; color: var(--amber); }
  .tag.in { background: #e7f2ec; color: var(--green); }
  .tag.off { background: #eef0f4; color: var(--muted); }

  .msg { border-radius: 8px; padding: 12px 15px; margin-bottom: 16px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: #fdecea; border: 1px solid #f3c2bd; color: var(--red); }
  .msg.ok { background: #e7f2ec; border: 1px solid #bcdcca; color: var(--green); }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; }
  .linkbox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; word-break: break-all; margin-top: 10px; }

  .check { display: flex; gap: 10px; align-items: center; margin: 2px 0 16px; }
  .check input { width: 17px; height: 17px; }
  .check label { font-weight: 400; font-size: 14px; margin: 0; color: var(--muted); }
  .sendrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .send { display: inline-block; background: var(--white); border: 1px solid var(--line); color: var(--navy); border-radius: 8px; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
  .send:hover { background: var(--soft); }
  .send.wa { border-color: #25D366; color: #128C4A; }
  nav.tabs { background: var(--navy-dark); }
  nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
  nav.tabs a { color: #b9c4d8; text-decoration: none; font-weight: 600; font-size: 14px; padding: 12px 16px; white-space: nowrap; border-bottom: 3px solid transparent; }
  nav.tabs a:hover { color: #fff; }
  nav.tabs a.on { color: #fff; border-bottom-color: #fff; }
  #login { max-width: 420px; margin: 60px auto; }
  @media (max-width: 700px) {
    th.hide, td.hide { display: none; }
    main { padding: 20px 0 48px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">PRECISION ELECTRONICS REPAIR · WORKSHOP</div>
    <div class="who" id="who" style="display:none">
      <span id="whoEmail"></span>
      <button id="signOut">Sign out</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" style="display:none"><div class="wrap">
  <a href="workshop.html" class="on">Jobs</a>
  <a href="invoices.html">Invoices</a>
  <a href="todo.html">To do</a>
  <a href="contacts.html">Contacts</a>
  <a href="leads.html">Leads</a>
  <a href="stock.html">Stock</a>
  <a href="diagnose.html">Diagnostic</a>
  <a href="knowledge.html">Knowledge</a>
  <a href="reports.html">Reports</a>
  <a href="settings.html">Settings</a>
</div></nav>

<main>
  <div class="wrap">

    <!-- Sign in -->
    <div id="login" class="card" style="display:none">
      <h1>Sign in</h1>
      <p class="sub">We'll email you a one-time sign-in link.</p>
      <div id="loginMsg" class="msg"></div>
      <label for="loginEmail">Email address</label>
      <input type="email" id="loginEmail" autocomplete="email" placeholder="info@precisionelectronicsrepair.co.uk">
      <button class="primary" id="loginBtn" style="width:100%">Email me a sign-in link</button>
    </div>

    <!-- Dashboard -->
    <div id="app" style="display:none">

      <div class="card" id="dropCard" style="display:none">
        <h2>Drop-offs &amp; collections booked</h2>
        <div id="dropArea"></div>
      </div>

      <div class="card">
        <h2>New job</h2>
        <div id="newMsg" class="msg"></div>

        <label for="custSearch">Dealt with them before?</label>
        <input type="text" id="custSearch" placeholder="Search by name, company, email or number" autocomplete="off">
        <div id="custHits"></div>
        <div id="custPicked" style="display:none;background:#e7f2ec;border:1px solid #bcdcca;border-radius:8px;padding:10px 14px;margin:-4px 0 16px;font-size:14px;color:#1c6b3c">
          <span id="custPickedName"></span>
          <button class="send" id="custClear" style="padding:4px 10px;margin-left:10px">Change</button>
        </div>

        <div class="row">
          <div>
            <label for="custName">Customer name</label>
            <input type="text" id="custName" placeholder="Jane Smith">
          </div>
          <div>
            <label for="custEmail">Customer email <span style="font-weight:400;color:var(--muted)">— optional</span></label>
            <input type="email" id="custEmail" placeholder="jane@example.com">
          </div>
          <div>
            <label for="custPhone">Mobile number <span style="font-weight:400;color:var(--muted)">— optional</span></label>
            <input type="text" id="custPhone" placeholder="07700 900123">
          </div>
        </div>
        <div class="row">
          <div style="flex:0 0 240px">
            <label for="prefContact">How do they prefer to be contacted?</label>
            <select id="prefContact" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;margin-bottom:14px">
              <option value="email">Email</option>
              <option value="whatsapp">WhatsApp</option>
              <option value="sms">Text message</option>
              <option value="call">Phone call</option>
            </select>
          </div>
        </div>

        <div class="check"><input type="checkbox" id="emailIt" checked><label for="emailIt">Email the link automatically (needs an email address)</label></div>
        <div class="check"><input type="checkbox" id="noDiag"><label for="noDiag">Obvious fault — no diagnostic fee (cracked screen, dead port, and the like)</label></div>
        <button class="primary" id="createBtn">Create job &amp; get link</button>

        <div id="sendArea" style="display:none">
          <div class="linkbox" id="newLink"></div>
          <div class="sendrow">
            <button class="send" id="copyBtn">Copy link</button>
            <a class="send wa" id="waBtn" target="_blank" rel="noopener">Send on WhatsApp</a>
            <a class="send" id="smsBtn">Send by text</a>
          </div>
        </div>
      </div>


      <div class="card">
        <h2>Jobs</h2>
        <div id="jobsMsg" class="msg"></div>
        <div id="jobsArea"><p class="empty">Loading…</p></div>
      </div>

    </div>

  </div>
</main>

<script type="module">
import { createClient } from './vendor/supabase-js.min.js';

const SUPABASE_URL = 'https://eazzljgezdownmcddeyr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Tk5nuWw8LkpIb73ttPIlBw_zdT567D6';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function show(el, text, kind) {
  el.textContent = text;
  el.className = 'msg show ' + kind;
}
function hide(el) { el.className = 'msg'; }

// ---------- sign in ----------
$('loginBtn').addEventListener('click', async () => {
  const email = $('loginEmail').value.trim();
  if (!email) return show($('loginMsg'), 'Please enter your email address.', 'err');
  $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href.split('#')[0] }
  });
  $('loginBtn').disabled = false;
  if (error) return show($('loginMsg'), error.message, 'err');
  show($('loginMsg'), 'Check your email for the sign-in link.', 'ok');
});

$('signOut').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

// ---------- jobs ----------
function fmt(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Your wording, not the customer's — the tracking page phrases these for them.
const STATUS_TEXT = {
  awaiting_intake: 'Awaiting form', intake_received: 'Form received',
  estimated: 'Estimate sent', dropoff_requested: 'Drop-off requested', dropoff_booked: 'Drop-off confirmed', in_post: 'In post',
  arrived: 'Arrived', in_diagnosis: 'In diagnosis', quoted: 'Quote sent',
  approved: 'Approved', declined: 'Declined', in_repair: 'In repair',
  testing: 'Testing', ready: 'Ready', invoiced: 'Invoiced', paid: 'Paid',
  returned: 'Returned', unrepairable: 'Unrepairable', closed: 'Expired'
};

// Amber while something is waiting on someone, green once it's settled,
// grey once the job is closed off.
const STATUS_TONE = {
  awaiting_intake: 'wait', intake_received: 'wait', estimated: 'wait', dropoff_requested: 'wait', dropoff_booked: 'in', in_post: 'wait',
  arrived: 'in', in_diagnosis: 'in', quoted: 'wait', approved: 'in',
  declined: 'off', in_repair: 'in', testing: 'in', ready: 'in',
  invoiced: 'wait', paid: 'in', returned: 'off',
  unrepairable: 'off', closed: 'off'
};

async function loadJobs() {
  const { data, error } = await sb.from('job_list').select('*').order('created_at', { ascending: false });
  if (error) {
    $('jobsArea').innerHTML = '';
    return show($('jobsMsg'), error.message, 'err');
  }
  if (!data.length) {
    $('jobsArea').innerHTML = '<p class="empty">No jobs yet. Create one above.</p>';
    return;
  }
  // Drop-off day and time, right under the status.
  const DROP = await dropoffsByJob();
  const rows = data.map(j => `
    <tr>
      <td class="jobno"><a href="job.html?job=${j.job_number}" style="text-decoration:none">${j.job_number}</a></td>
      <td>${j.customer_name || '<span style="color:#5a6474">—</span>'}${j.customer_email ? `<br><span style="color:#5a6474;font-size:13px">${j.customer_email}</span>` : ''}</td>
      <td class="hide">${j.make_model || ''}${j.fault_description ? `<br><span style="color:#5a6474;font-size:13px">${j.fault_description.slice(0, 60)}${j.fault_description.length > 60 ? '…' : ''}</span>` : ''}</td>
      <td><span class="tag ${STATUS_TONE[j.status] || 'wait'}">${(STATUS_TEXT[j.status] || j.status_label || j.status || '').replace(/</g, '&lt;')}</span>${
        DROP[j.job_number] && /^dropoff_/.test(j.status) ? `<br><span style="font-size:13px;font-weight:600;color:#1B2A4A">${dropText(DROP[j.job_number].starts_at)}</span>` : ''}</td>
      <td class="hide">${fmt(j.submitted_at || j.created_at)}</td>
    </tr>`).join('');
  $('jobsArea').innerHTML = `<table>
    <thead><tr><th>Job</th><th>Customer</th><th class="hide">Item</th><th>Status</th><th class="hide">Date</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function ukNumber(raw) {
  const digits = String(raw || '').replace(/[^0-9+]/g, '');
  if (!digits) return '';
  if (digits.startsWith('+')) return digits.slice(1);
  if (digits.startsWith('44')) return digits;
  if (digits.startsWith('0')) return '44' + digits.slice(1);
  return digits;
}

// On a computer, hand the message to the WhatsApp desktop app; on a phone, wa.me opens it.
const ON_PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const WA_TARGET = ON_PHONE ? '_blank' : '_self';
function waLink(num, message) {
  const text = encodeURIComponent(message || '');
  if (ON_PHONE) return 'https://wa.me/' + (num || '') + '?text=' + text;
  return 'whatsapp://send?' + (num ? 'phone=' + num + '&' : '') + 'text=' + text;
}

$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('newLink').textContent);
    $('copyBtn').textContent = 'Copied';
    setTimeout(() => { $('copyBtn').textContent = 'Copy link'; }, 2000);
  } catch (e) {
    show($('newMsg'), 'Could not copy automatically — select the link above and copy it.', 'err');
  }
});

// ---------- returning customers ----------
// Picking someone you have dealt with before ties the job to their record,
// which is what makes the booking form fill itself in.
let PICKED = null;
let searchTimer = null;

function clearPick() {
  PICKED = null;
  $('custPicked').style.display = 'none';
  $('custSearch').style.display = '';
  $('custSearch').value = '';
  $('custHits').innerHTML = '';
}

$('custClear').addEventListener('click', () => {
  clearPick();
  $('custName').value = ''; $('custEmail').value = ''; $('custPhone').value = '';
});

$('custSearch').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = $('custSearch').value.trim();
  if (q.length < 2) { $('custHits').innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    const { data, error } = await sb.rpc('find_contacts', { p_query: q });
    if (error) return;
    const rows = data || [];
    $('custHits').innerHTML = rows.length
      ? rows.map(c => {
          const who = [c.name, c.company].filter(Boolean).join(' · ') || c.email || c.phone;
          const sub = [c.email, c.phone].filter(Boolean).join(' · ');
          const jobs = Number(c.job_count || 0);
          return `<div class="hitrow" data-pick='${JSON.stringify(c).replace(/'/g, '&#39;')}'
            style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;background:#fff">
            <div style="font-weight:600;font-size:14px">${who.replace(/</g,'&lt;')}</div>
            <div style="font-size:13px;color:var(--muted)">${sub.replace(/</g,'&lt;')}${jobs ? ' · ' + jobs + ' previous job' + (jobs === 1 ? '' : 's') : ''}</div>
          </div>`;
        }).join('')
      : '<p class="empty" style="padding:8px 0">No match — fill the details in below and a new record is made.</p>';

    $('custHits').querySelectorAll('[data-pick]').forEach(el => el.addEventListener('click', () => {
      const c = JSON.parse(el.dataset.pick);
      PICKED = c;
      $('custName').value = c.name || '';
      $('custEmail').value = c.email || '';
      $('custPhone').value = c.phone || '';
      if (c.preferred_contact) $('prefContact').value = c.preferred_contact;
      $('custPickedName').textContent = 'Using ' + ([c.name, c.company].filter(Boolean).join(' · ') || c.email) +
        '. Their details will already be on the booking form.';
      $('custPicked').style.display = 'block';
      $('custSearch').style.display = 'none';
      $('custHits').innerHTML = '';
    }));
  }, 250);
});

$('createBtn').addEventListener('click', async () => {
  hide($('newMsg'));
  $('sendArea').style.display = 'none';
  const name = $('custName').value.trim();
  const email = $('custEmail').value.trim();
  const phone = $('custPhone').value.trim();
  const wantEmail = $('emailIt').checked;
  const preferred = $('prefContact').value;

  if (wantEmail && !email) {
    return show($('newMsg'), "Enter an email address, or untick 'Email the link automatically'.", 'err');
  }
  if (!email && !phone) {
    return show($('newMsg'), 'Enter an email address or a mobile number.', 'err');
  }

  $('createBtn').disabled = true;
  $('createBtn').textContent = 'Working…';

  const { data, error } = await sb.rpc('create_job', {
    p_customer_name: name,
    p_customer_email: email || null,
    p_customer_phone: phone || null,
    p_company: PICKED?.company || null,
    p_contact_id: PICKED?.id || null,
    p_preferred: preferred,
    p_diag_fee: !$('noDiag').checked
  });
  if (error) {
    $('createBtn').disabled = false;
    $('createBtn').textContent = 'Create job & get link';
    return show($('newMsg'), error.message, 'err');
  }
  const job = Array.isArray(data) ? data[0] : data;

  // message for WhatsApp / text
  const hi = name ? ('Hi ' + name + ', ') : '';
  const msg = hi + 'your job number with Precision Electronics Repair is ' + job.job_number +
              '. Please fill in your booking form here: ' + job.link +
              ' — any questions, call 07522 124273.';

  $('newLink').textContent = job.link;
  const num = ukNumber(phone);
  const waBtn = $('waBtn'), smsBtn = $('smsBtn');
  waBtn.href = waLink(num, msg);
  waBtn.target = WA_TARGET;
  waBtn.style.display = '';
  if (num) {
    smsBtn.href = 'sms:+' + num + '?&body=' + encodeURIComponent(msg);
    smsBtn.style.display = '';
  } else {
    smsBtn.style.display = 'none';
  }
  $('sendArea').style.display = 'block';

  const PREF_WORD = { email: 'email', whatsapp: 'WhatsApp', sms: 'a text', call: 'a phone call' };
  let note = job.job_number + ' created. They prefer ' + PREF_WORD[preferred] + '.';
  if (wantEmail && email) {
    const { data: sess } = await sb.auth.getSession();
    const token = sess?.session?.access_token;
    const res = await fetch(SUPABASE_URL + '/functions/v1/send-job-link', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_number: job.job_number, to: email, name })
    });
    const out = await res.json().catch(() => ({}));
    if (out.ok) {
      show($('newMsg'), note + ' Booking link emailed to ' + email + '. You can also send it by WhatsApp or text below.', 'ok');
    } else {
      show($('newMsg'), note + ' The email did not send (' + (out.error || 'unknown error') + '). Use the buttons below instead.', 'err');
    }
  } else {
    show($('newMsg'), note + ' Send the link using the buttons below.', 'ok');
  }

  $('createBtn').disabled = false;
  $('createBtn').textContent = 'Create job & get link';
  $('custName').value = ''; $('custEmail').value = ''; $('custPhone').value = '';
  $('noDiag').checked = false;
  clearPick();
  loadJobs();
});

// ---------- drop-offs ----------
const dropText = ts => new Date(ts).toLocaleString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

// job number -> its live drop-off (shared by every item on the booking)
async function dropoffsByJob() {
  const { data: appts } = await sb.from('appointments').select('batch_id, starts_at, confirmed_at').is('cancelled_at', null).eq('kind', 'dropoff');
  if (!appts || !appts.length) return {};
  const byBatch = Object.fromEntries(appts.map(a => [a.batch_id, a]));
  const { data: jobs } = await sb.from('jobs').select('id, job_number, batch_id');
  const out = {};
  (jobs || []).forEach(j => { const a = byBatch[j.batch_id || j.id]; if (a) out[j.job_number] = a; });
  return out;
}

async function confirmDropoff(jobNo, btn, kind) {
  btn.disabled = true; btn.textContent = 'Confirming…';
  const { data: sess } = await sb.auth.getSession();
  const col = kind === 'collection';
  const res = await fetch(SUPABASE_URL + '/functions/v1/' + (col ? 'collection' : 'confirm-dropoff'), {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + sess.session.access_token, 'Content-Type': 'application/json' },
    body: JSON.stringify(col ? { action: 'confirm', job_number: jobNo } : { job_number: jobNo })
  });
  const out = await res.json().catch(() => ({ ok: false, error: 'No reply from the server.' }));
  if (!out.ok) { btn.disabled = false; btn.textContent = 'Confirm'; show($('jobsMsg'), out.error || 'Could not confirm.', 'err'); return; }
  loadDropoffs(); loadJobs();
}
// Customers who've booked to bring items in themselves. Hidden when there are none.
async function loadDropoffs() {
  const since = new Date(Date.now() - 2 * 3600 * 1000).toISOString();
  const { data, error } = await sb.from('appointments')
    .select('starts_at, confirmed_at, kind, jobs(job_number, customer_name, customer_phone, batch_id, batch_size)')
    .is('cancelled_at', null).gte('starts_at', since).order('starts_at');
  if (error || !data || !data.length) { $('dropCard').style.display = 'none'; return; }
  const t = dropText;
  const e = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  $('dropArea').innerHTML = `<table><tbody>${data.map(a => {
    const j = a.jobs || {};
    const n = j.batch_size > 1 ? ` <span style="color:#5a6474">+ ${j.batch_size - 1} more item${j.batch_size > 2 ? 's' : ''}</span>` : '';
    const k = a.kind === 'collection'
      ? '<span class="tag" style="background:#e8eefb;color:#1B2A4A">Collection</span>'
      : '<span class="tag wait">Drop-off</span>';
    return `<tr><td style="white-space:nowrap"><strong>${t(a.starts_at)}</strong><br>${k}</td>
      <td>${e(j.customer_name)}${j.customer_phone ? `<br><span style="color:#5a6474;font-size:13px">${e(j.customer_phone)}</span>` : ''}</td>
      <td class="jobno"><a href="job.html?job=${e(j.job_number)}" style="text-decoration:none">${e(j.job_number)}</a>${n}</td>
      <td style="text-align:right">${a.confirmed_at
        ? '<span class="tag in">Confirmed</span>'
        : `<button class="primary" data-confirm="${e(j.job_number)}" data-kind="${e(a.kind)}" style="padding:8px 16px">Confirm</button>`}</td></tr>`;
  }).join('')}</tbody></table>`;
  $('dropArea').querySelectorAll('[data-confirm]').forEach(b => b.addEventListener('click', () => confirmDropoff(b.dataset.confirm, b, b.dataset.kind)));
  $('dropCard').style.display = 'block';
}

// ---------- start ----------
async function start() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    $('whoEmail').textContent = data.session.user.email;
    $('who').style.display = 'flex';
    $('app').style.display = 'block';
    $('login').style.display = 'none';
    $('tabs').style.display = 'block';
    loadJobs();
    loadDropoffs();
  } else {
    $('login').style.display = 'block';
  }
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') start();
});

start();
</script>
